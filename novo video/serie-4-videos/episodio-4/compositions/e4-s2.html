<!doctype html><html lang="pt-BR"><body><template>
<div id="e4-s2" data-composition-id="e4-s2" data-width="1920" data-height="1080"><div class="stage"><div class="inside"><div class="stack"><div class="eyebrow accent">O PAPEL DO CLIMA</div><h2>O cenário climático mudou.</h2><div class="climate"><div class="climate-box"><strong>2025</strong><span>Sem El Niño no período</span></div><div class="climate-box"><strong>2026</strong><span>Com El Niño no período</span></div></div><div class="callout">A comparação não prova quanto do aumento se deve ao El Niño.</div></div></div></div></div>
<script>
(()=>{const el=document.getElementById('e4-s2');const tl=gsap.timeline({paused:true});
tl.fromTo(el.querySelector('.inside'),{opacity:0,y:18},{opacity:1,y:0,duration:.45,ease:'power2.out'},0);
el.querySelectorAll('.history-state').forEach(item=>{const a=Number(item.dataset.at),b=Number(item.dataset.until);tl.fromTo(item,{opacity:0},{opacity:1,duration:.08,immediateRender:false},a);tl.to(item,{opacity:0,duration:.06},b-.06);});
el.querySelectorAll('.barfill').forEach((item,k)=>tl.fromTo(item,{scaleX:0},{scaleX:Number(item.dataset.ratio),duration:1.1,ease:'power2.out'},.5+k*.3));
window.__timelines['e4-s2']=tl;})();
</script></template></body></html>
