<!doctype html><html lang="pt-BR"><body><template>
<div id="e3-s5" data-composition-id="e3-s5" data-width="1920" data-height="1080"><div class="stage"><div class="inside"><div class="stack"><div class="eyebrow accent">NO PRÓXIMO VÍDEO</div><h1>O que mudou desde 2025?</h1><p class=lead>Vamos comparar os mesmos períodos.</p><div class="tag">Parte 4 · Comparação e responsabilidade</div></div></div></div></div>
<script>
(()=>{const el=document.getElementById('e3-s5');const tl=gsap.timeline({paused:true});
