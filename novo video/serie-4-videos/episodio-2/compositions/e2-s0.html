<!doctype html><html lang="pt-BR"><body><template>
<div id="e2-s0" data-composition-id="e2-s0" data-width="1920" data-height="1080"><div class="stage"><div class="inside"><div class="two"><div class="stack"><div class="eyebrow accent">ENTENDA O CONTEXTO</div><h1>Por que falar de fogo agora?</h1><p class=lead>A estiagem deixa a vegetação mais vulnerável.</p></div><div class="mapbox"><img class="map" src="assets/overview.svg" alt="Amazônia Legal com o Xingu destacado"></div></div></div></div></div>
<script>
(()=>{const el=document.getElementById('e2-s0');const tl=gsap.timeline({paused:true});
